name: links and evals

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail if a skill or reference path is missing
        run: python3 skills/reels-india/scripts/check_links.py
      - name: Deterministic eval checks
        run: python3 skills/reels-india/scripts/run_evals.py
